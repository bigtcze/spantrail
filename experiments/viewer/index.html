<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>SpanTrail · Local artifact</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="SpanTrail home"><span class="brand-mark" aria-hidden="true">↳</span>SpanTrail</a>
      <span class="local-label"><span aria-hidden="true"></span>Local artifact viewer</span>
      <button class="reload" type="button" data-testid="reload">Reload artifact <span aria-hidden="true">↻</span></button>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div><p class="eyebrow">Runtime evidence / controlled fixture</p><h1 id="page-title">Follow the observed trail.</h1><p class="intro-copy">Serialized browser actions, linked to observed backend spans.</p></div>
        <div class="artifact-label"><span class="eyebrow">LOCAL INPUT</span><code>/artifact.json</code></div>
      </section>
      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
      <div id="workspace" aria-busy="true"></div>
      <footer><span>Evidence, not a reconstruction.</span><span>Durations are observed span lengths, not a timeline.</span></footer>
    </main>
    <noscript><p class="noscript">Enable JavaScript to inspect the local artifact.</p></noscript>
  </body>
</html>
